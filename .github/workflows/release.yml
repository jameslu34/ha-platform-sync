name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match the integration version)
        required: true
        default: "v0.6.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release tag matches integration version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          manifest_version="$(jq -r '.version' custom_components/platform_sync/manifest.json)"
          expected_tag="v${manifest_version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match manifest version ${manifest_version}." >&2
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
      - name: Run core acceptance simulation
        run: python tests/simulate_acceptance.py
      - name: Run adapter and safety acceptance simulation
        run: python tests/simulate_adapter_acceptance.py
      - name: Run configuration-flow acceptance simulation
        run: python tests/simulate_config_flow_acceptance.py
      - name: Validate translations
        run: python tests/validate_translations.py
      - name: Compile Python sources
        run: python -m compileall custom_components/platform_sync tests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing to create."
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              --title "${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --generate-notes \
              --title "${RELEASE_TAG}"
          fi
