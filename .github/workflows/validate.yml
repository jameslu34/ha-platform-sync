name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate integration
        uses: home-assistant/actions/hassfest@master
