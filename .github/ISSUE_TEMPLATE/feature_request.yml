name: Feature request
description: Suggest a reusable improvement for the integration
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe a general Home Assistant use case. Do not include credentials, private host names, or household-specific identifying details.
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: This request is reusable beyond a single household configuration.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired setup flow and synchronization result.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: How should failure, rollback, unsupported platforms, or native-paired devices be handled?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
